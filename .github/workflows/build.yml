name: Compilation

# Une PR compile Windows seulement (le zip à essayer au travail). Les trois systèmes ne sont
# compilés que pour une version (tag `v*`) ou à la demande (« Run workflow » dans Actions) : sur
# un dépôt privé, Windows compte 2× et macOS 10× dans le quota de minutes.
on:
  push:
    tags: ["v*"]
  pull_request:
    # Une modification de la documentation seule ne relance pas la compilation.
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Binaire portable : pas d'optimisation « -march=native » de la machine de CI.
  GGML_NATIVE: "OFF"

# Une nouvelle poussée annule la compilation précédente de la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Windows : puce graphique (Vulkan) retenue seulement si l'étalonnage la trouve plus rapide et
        # juste (voir src/gpu.rs).
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"windows-latest","artifact":"tourdetable-windows-x64","features":"--features vulkan,tourdetable-redaction/vulkan"}]' || '[{"os":"windows-latest","artifact":"tourdetable-windows-x64","features":"--features vulkan,tourdetable-redaction/vulkan"},{"os":"macos-15","artifact":"tourdetable-macos-arm64","features":"--features metal,tourdetable-redaction/metal"},{"os":"ubuntu-24.04","artifact":"tourdetable-linux-x64","features":""}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev cmake clang

      - name: Instructions CPU (x86-64)
        if: runner.os != 'macOS'
        shell: bash
        # AVX2/FMA : présents sur tous les processeurs Intel/AMD depuis ~2013-2015.
        run: |
          echo "GGML_AVX=ON" >> $GITHUB_ENV
          echo "GGML_AVX2=ON" >> $GITHUB_ENV
          echo "GGML_FMA=ON" >> $GITHUB_ENV
          echo "GGML_F16C=ON" >> $GITHUB_ENV

      # Les noyaux Vulkan se compilent très loin dans target/ : MSBuild dépasse la limite de
      # 260 caractères des chemins Windows (FTK1011). Compilation dans C:\t, un lien vers target/
      # (le cache et les chemins target/release des étapes suivantes restent valables).
      - name: Dossier de compilation court (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target | Out-Null
          New-Item -ItemType Junction -Path C:\t -Target "$PWD\target" | Out-Null
          Add-Content $env:GITHUB_ENV "CARGO_TARGET_DIR=C:\t"

      # Compilation des noyaux Vulkan (glslc) et bibliothèque d'importation de vulkan-1.dll.
      - name: SDK Vulkan (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VULKAN_VERSION: 1.4.313.2
        run: |
          curl.exe -sSLo "$env:RUNNER_TEMP\vulkansdk.exe" "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\vulkansdk.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\Bin"

      # Générateur Ninja : avec celui de Visual Studio (compilation parallèle), l'installation de
      # vulkan-shaders-gen partait avant sa configuration (« Not a file: cmake_install.cmake »).
      # Ninja exige l'environnement MSVC (cl.exe, et Ninja fourni par Visual Studio).
      - name: Environnement MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Générateur Ninja (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV

      # whisper.cpp déclare une vieille version minimale de CMake : on active la
      # politique moderne pour que le choix du runtime statique (/MT) s'applique.
      - name: Runtime Visual C++ statique (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CMAKE_POLICY_DEFAULT_CMP0091=NEW" >> $GITHUB_ENV
          echo "CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" >> $GITHUB_ENV
          # llama.cpp (programme de rédaction) n'adopte /MT que sur demande explicite.
          echo "LLAMA_STATIC_CRT=1" >> $GITHUB_ENV

      - name: Tests
        run: cargo test --workspace ${{ matrix.features }}

      - name: Compilation
        run: cargo build --release --workspace ${{ matrix.features }}

      # Garde-fou : l'exécutable doit démarrer sur un Windows neuf, sans le
      # « Redistribuable Visual C++ » (erreur VCRUNTIME140_1.dll introuvable).
      - name: Vérification des DLL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $objdump = Get-ChildItem "C:\Program Files\LLVM\bin\llvm-objdump.exe", "${env:ProgramFiles}\LLVM\bin\llvm-objdump.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          foreach ($exe in "tourdetable.exe", "tourdetable-redaction.exe") {
            $dlls = & $objdump.FullName -p "target/release/$exe" | Select-String "DLL Name" | ForEach-Object { ($_ -split ":")[1].Trim() }
            Write-Host "DLL importées par $exe :"; $dlls | ForEach-Object { Write-Host "  $_" }
            $bad = $dlls | Where-Object { $_ -match '^(vcruntime|msvcp|concrt|vcomp|api-ms-win-crt)' }
            if ($bad) { Write-Error "$exe dépend du runtime Visual C++ : $($bad -join ', ')"; exit 1 }
          }

      - name: Emballage Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/tourdetable.exe dist/TourDeTable.exe
          Copy-Item target/release/tourdetable-redaction.exe dist/
          # Chargeur Vulkan (Khronos, Apache 2.0) livré à côté : sans lui, l'application ne
          # démarrerait pas sur un poste sans pilote Vulkan (machine virtuelle).
          $vk = @("$env:VULKAN_SDK\Bin\vulkan-1.dll", "$env:SystemRoot\System32\vulkan-1.dll") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $vk) { Write-Error "vulkan-1.dll introuvable"; exit 1 }
          Copy-Item $vk dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact }}.zip

      # Paquet pour le Microsoft Store. Il n'est pas signé : le Store le signe à la
      # publication. (Pour l'installer à la main, il faudrait le signer soi-même.)
      - name: Paquet MSIX (Microsoft Store)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value + ".0"
          New-Item -ItemType Directory -Force msix/Assets | Out-Null
          Copy-Item target/release/tourdetable.exe msix/TourDeTable.exe
          Copy-Item target/release/tourdetable-redaction.exe msix/
          Copy-Item dist/vulkan-1.dll msix/
          Copy-Item packaging/windows/Assets/* msix/Assets/
          (Get-Content packaging/windows/AppxManifest.xml -Raw) -replace 'Version="0\.0\.0\.0"', "Version=`"$version`"" |
            Set-Content msix/AppxManifest.xml -Encoding utf8
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          Write-Host "makeappx : $($makeappx.FullName) · version $version"
          & $makeappx.FullName pack /d msix /p ${{ matrix.artifact }}.msix /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Emballage macOS
        if: runner.os == 'macOS'
        run: |
          APP="dist/Tour de table.app/Contents"
          mkdir -p "$APP/MacOS" "$APP/Resources"
          cp target/release/tourdetable target/release/tourdetable-redaction "$APP/MacOS/"
          cp packaging/macos/Info.plist "$APP/"
          mkdir tourdetable.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon-1024.png --out tourdetable.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) assets/icon-1024.png --out tourdetable.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns tourdetable.iconset -o "$APP/Resources/tourdetable.icns"
          codesign --force --deep --sign - "dist/Tour de table.app"
          (cd dist && zip -qry ../${{ matrix.artifact }}.zip "Tour de table.app")

      - name: Emballage Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/tourdetable target/release/tourdetable-redaction packaging/linux/tourdetable.desktop assets/icon-256.png README.md dist/
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: tourdetable-*
