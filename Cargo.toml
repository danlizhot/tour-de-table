[package]
name = "tourdetable"
description = "Transcription locale de rencontres en français québécois"
license = "MIT"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wgpu_no_default_features", "wayland", "x11"] }
# Moteur d'affichage de secours : Direct3D 12 (dont WARP, le rendu logiciel de Windows
# pour les machines virtuelles sans carte graphique) et Metal. Seuls ces backends sont compilés.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "dx12", "metal"] }
env_logger = "0.11.11"
hound = "3.5.1"
log = "0.4.34"
pdf-extract = "0.12.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", features = ["json"] }
whisper-rs = { version = "0.16.0", features = ["log_backend"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
egui-wgpu = { version = "0.37", default-features = false }
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "aac", "alac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm", "adpcm"] }

[dev-dependencies]
resvg = "0.48.1"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[workspace]
members = [".", "redaction"]

[features]
default = []
# Accélération GPU de whisper.cpp
metal = ["whisper-rs/metal"]
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# « unwind » plutôt qu'« abort » : un plantage pendant l'essai d'un moteur d'affichage
# est intercepté pour passer au suivant (voir main.rs).
panic = "unwind"
strip = true

[package.metadata.winresource]
ProductName = "Tour de table"
FileDescription = "Tour de table — transcription de rencontres en français québécois"
LegalCopyright = "MIT"
